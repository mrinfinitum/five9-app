<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light only" />
<title>Five9 Media</title>
</head>
<body style="margin:0;padding:0;background:#f2f2f0;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f2f2f0;">
<tr><td align="center" style="padding:32px 16px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;background:#ffffff;border-radius:16px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#121212;">
    <tr><td align="center" style="background:#0a0a0a;padding:26px 24px;border-bottom:4px solid #e10600;">
      <img src="https://app.five9.media/five9-logo.png" alt="five9" width="110" style="display:block;width:110px;height:auto;border:0;" />
    </td></tr>
    <tr><td align="center" style="padding:36px 36px 40px 36px;">
      <h1 style="margin:0 0 12px 0;font-size:24px;line-height:30px;font-weight:800;color:#121212;">Sign in to Five9 Media</h1>
      <p style="margin:0 0 28px 0;font-size:16px;line-height:24px;color:#4a4a4a;">Tap the button below to sign in. This link works once.</p>
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 32px;background:#e10600;font-size:16px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:10px;">Sign in</a>
    </td></tr>
  </table>
  <p style="margin:16px 0 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;color:#9a9a9a;">Sent to {{ .Email }} &middot; Five9 Media</p>
</td></tr>
</table>
</body>
</html>
